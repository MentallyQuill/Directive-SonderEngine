    const onboarding = new URLSearchParams(location.search).has("onboarding");
    let registeredView = null;
    let topButton = null;
    const host = document.querySelector("#host");
    const sonder = {
      registerView(view) { registeredView = view; },
      registerTopBarButton(button) { topButton = button; },
      registerSettingsSection() {},
      registerStepRenderer() {},
      state() { return { chatId: onboarding ? null : 27 }; },
      api: async () => PROJECTION,
      chats: { open: async () => {} },
      refresh: async () => {},
      openView(id) {
        if (registeredView?.id !== id) return false;
        registeredView.render(host);
        return true;
      },
      closeView() { host.replaceChildren(); }
    };
    register(sonder);
    document.querySelector("#launcher").addEventListener("click", () => topButton.onClick());
    window.__directiveHarness = { sonder, projection: PROJECTION };
